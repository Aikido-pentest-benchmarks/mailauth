name: Run tests

on:
    push:
    pull_request:

jobs:
    test:
        strategy:
            matrix:
                node: [22.x, 24.x]
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7.2.0
            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v7.1.0
              with:
                  node-version: ${{ matrix.node }}
            - run: npm install
            - run: npm test
